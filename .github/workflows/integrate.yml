name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: sudo apt update && sudo apt install -y libgtk-4-1 libwebkitgtk-6.0-4
        if: ${{ matrix.platform == 'linux' }}
      - run: |
          $arch = @{ X64 = 'x64'; ARM64 = 'arm64' }[$env:ARCH]

          if ($null -eq $arch) {
            Write-Error "Unsupported architecture '$env:ARCH'"
            exit 1
          }

          $installer = Join-Path $env:RUNNER_TEMP "windowsappruntimeinstall-$arch.exe"

          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/$env:VERSION/latest/windowsappruntimeinstall-$arch.exe" -OutFile $installer

          & $installer --quiet

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell
        env:
          VERSION: '1.8'
          ARCH: ${{ runner.arch }}
        if: ${{ matrix.platform == 'win32' }}
      - run: npm test
      - run: |
          $cdb = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Debuggers' -Recurse -Filter cdb.exe -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like '*\x64' } | Select-Object -First 1

          if ($null -eq $cdb) {
            Write-Output 'No debugger was found'
            exit 0
          }

          & $cdb.FullName -y 'srv*C:\symbols*https://msdl.microsoft.com/download/symbols' -c 'g; .exr -1; !analyze -v; q' build\test\pass\Tests\App\Tests.exe
        shell: powershell
        timeout-minutes: 10
        if: ${{ failure() && matrix.platform == 'win32' }}
