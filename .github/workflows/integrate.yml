name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: sudo apt update && sudo apt install -y libgtk-4-1 libwebkitgtk-6.0-4
        if: ${{ matrix.platform == 'linux' }}
      - run: |
          $arch = @{ X64 = 'x64'; ARM64 = 'arm64' }[$env:ARCH]

          if ($null -eq $arch) {
            Write-Error "Unsupported architecture '$env:ARCH'"
            exit 1
          }

          $installer = Join-Path $env:RUNNER_TEMP "windowsappruntimeinstall-$arch.exe"

          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/$env:VERSION/latest/windowsappruntimeinstall-$arch.exe" -OutFile $installer

          & $installer --quiet

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell
        env:
          VERSION: '1.8'
          ARCH: ${{ runner.arch }}
        if: ${{ matrix.platform == 'win32' }}
      - run: |
          nohup bash -c '
            sleep 150
            ps -axo pid,ppid,etime,command | awk "NR == 1 || \$4 ~ /(bare|Tests|\/open|^open|\/cat|^cat|simctl|adb|codesign|xcrun|npm)\$/"
            lsappinfo list
            log show --last 3m --style compact --predicate "process == \"Tests\" OR subsystem == \"com.apple.launchservices\"" | tail -200
            screencapture -x "$RUNNER_TEMP/screen.png"
          ' > "$RUNNER_TEMP/diagnostics.txt" 2>&1 &
        if: ${{ matrix.platform == 'darwin' }}
      - run: npm test
        timeout-minutes: 4
      - run: cat "$RUNNER_TEMP/diagnostics.txt"
        if: ${{ failure() && matrix.platform == 'darwin' }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screen
          path: ${{ runner.temp }}/screen.png
        if: ${{ failure() && matrix.platform == 'darwin' }}
