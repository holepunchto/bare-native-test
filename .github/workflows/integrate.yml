name: Integrate
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    name: Security
    steps:
      - uses: holepunchto/actions/security-base@v1
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: sudo apt update && sudo apt install -y libgtk-4-1 libwebkitgtk-6.0-4
        if: ${{ matrix.platform == 'linux' }}
      - run: |
          $arch = @{ X64 = 'x64'; ARM64 = 'arm64' }[$env:ARCH]

          if ($null -eq $arch) {
            Write-Error "Unsupported architecture '$env:ARCH'"
            exit 1
          }

          $installer = Join-Path $env:RUNNER_TEMP "windowsappruntimeinstall-$arch.exe"

          Invoke-WebRequest -Uri "https://aka.ms/windowsappsdk/$env:VERSION/latest/windowsappruntimeinstall-$arch.exe" -OutFile $installer

          & $installer --quiet

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
        env:
          VERSION: '1.8'
          ARCH: ${{ runner.arch }}
        if: ${{ matrix.platform == 'win32' }}
      - run: npm test
      - run: |
          Get-AppxPackage -Name *WindowsAppRuntime* | Format-Table Name, Version, Architecture -AutoSize

          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Id = 1000, 1001 } -MaxEvents 10 -ErrorAction SilentlyContinue | Format-List TimeCreated, ProviderName, Message

          Get-ChildItem C:\ProgramData\Microsoft\Windows\WER -Recurse -Filter Report.wer -ErrorAction SilentlyContinue | Where-Object { $_.DirectoryName -like '*Tests.exe*' } | ForEach-Object { Write-Output "== $($_.FullName)"; Get-Content $_.FullName -Encoding Unicode }
        shell: pwsh
        if: ${{ failure() && matrix.platform == 'win32' }}
